<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CrashGuessr</title>
<meta name="description" content="A daily dashcam geography game. Watch the clip, drop a pin where it happened." />
<meta name="theme-color" content="#17181c" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta property="og:title" content="CrashGuessr" />
<meta property="og:description" content="A daily dashcam geography game. Watch the clip, drop a pin where it happened." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317181c'/%3E%3Cpath d='M16 5a8 8 0 0 0-8 8c0 6 8 14 8 14s8-8 8-14a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z' fill='%23ff5c5c'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://www.youtube.com" />
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<link rel="stylesheet" href="style.css?v=1795405003" />
</head>
<body>

<header id="topbar">
  <div class="brand">CrashGuessr</div>
  <div id="sponsorTop" class="sponsor-top" hidden></div>
  <div class="hud">
    <span id="roundLabel">Round 1 / 5</span>
    <span id="scoreLabel">Score: 0</span>
  </div>
</header>

<main id="game">
  <section id="clipPane">
    <div id="videoWrap">
      <div id="ytFrame" hidden><div id="ytPlayerTarget"></div></div>
      <div id="videoLoading" hidden>
        <div class="spinner"></div>
        <button id="tapPlayBtn" type="button" hidden>Tap to play</button>
      </div>
      <video id="fileVideo" hidden controls autoplay muted loop playsinline></video>
      <div id="textClip" hidden class="text-clip"></div>
    </div>
    <div id="clipMeta"></div>
  </section>

  <section id="mapPane">
    <div id="map" aria-label="World map: tap or click to place your guess"></div>
    <div id="controls">
      <button id="guessBtn" type="button" disabled>Place a pin to guess</button>
    </div>
    <div id="resultOverlay" class="result-panel" hidden role="status" aria-live="polite">
      <div class="result-text">
        <h2 id="resultTitle"></h2>
        <p class="result-line"><span id="resultDistance"></span> <span class="dot">&middot;</span> <span id="resultPoints"></span></p>
      </div>
      <button id="resultNextBtn" type="button">Next round</button>
    </div>
  </section>
</main>

<div id="adBanner" class="ad-slot ad-banner" hidden></div>

<div id="finalOverlay" hidden>
  <div class="card final-card" role="dialog" aria-labelledby="finalTitle">
    <h2 id="finalTitle">Final Score</h2>
    <p id="finalScore"></p>
    <div id="shareGrid"></div>
    <ol id="finalRounds"></ol>
    <div class="final-actions">
      <button id="shareBtn" type="button" hidden>Share</button>
      <button id="copyResultBtn" type="button">Copy Result</button>
    </div>
    <p id="dailyNote"></p>
    <div id="sponsorFinal" class="sponsor-final" hidden></div>
    <div id="affiliateBox" class="affiliate-box" hidden></div>
    <div id="adFinal" class="ad-slot ad-final" hidden></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="https://www.youtube.com/iframe_api" async></script>
<script src="config.js?v=1795405003"></script>
<script src="data.js?v=1795405003"></script>
<script src="app.js?v=1795405003"></script>
<script src="monetize.js?v=1795405003"></script>
</body>
</html>
